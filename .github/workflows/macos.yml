name: macos

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # One job per Mac CPU: a separate tarball for each, not a universal binary, because BitWindow
    # picks its download by CPU name. macos-15-intel is GitHub's Intel image. macos-14 is retired on 2026-11-02
    # (brownouts from 10-05), so Apple Silicon builds on macos-15 too: both tarballs need macOS 15 or later.
    # Each CPU also gets an easynet build (configure --with-easynet): freebank-easynet-<version>-<arch>-apple-darwin,
    # which BitWindow's freebank-<digits>- pattern never picks.
    strategy:
      fail-fast: false
      matrix:
        net: [beta, easynet]
        arch: [arm64, x86_64]
        include:
          - arch: arm64
            runner: macos-15
            dbbuild: arm-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            dbbuild: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      PKG: ${{ matrix.net == 'easynet' && 'freebank-easynet' || 'freebank' }}
    permissions:
      contents: read
      id-token: write      # signed build provenance (attestation) for tagged releases
      attestations: write
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install automake libtool pkg-config boost@1.85 libevent gnu-tar
          brew list --versions boost@1.85 libevent openssl@3 || true

      - name: Build static BDB 4.8 (Core-standard, from source)
        # brew's berkeley-db ships no static archive, and 18.1 diverges from
        # the wallet format Core's depends builds. install_db4.sh builds
        # db-4.8.30.NC statically with the clang patch. --build overrides the
        # 2009-era config.guess that predates Apple Silicon (set on Intel too, for symmetry).
        run: |
          CFLAGS="-Wno-error=implicit-function-declaration" \
            ./contrib/install_db4.sh "$PWD" --build=${{ matrix.dbbuild }}
          ls db4/lib/

      - name: Stage static archives
        # Portability: link brew deps STATICALLY. A directory offering only .a
        # files (searched before any dylib dir) forces ld64 to embed the code,
        # so the shipped binaries reference nothing outside /usr/lib and
        # /System/Library. include/boost symlink makes this dir double as the
        # --with-boost root, keeping brew's dylib dir out of BOOST_LDFLAGS.
        run: |
          STATICROOT="$PWD/.staticdeps"
          mkdir -p "$STATICROOT/lib" "$STATICROOT/include"
          for keg in boost@1.85 openssl@3 libevent; do
            cp -L "$(brew --prefix $keg)"/lib/*.a "$STATICROOT/lib/" 2>/dev/null || true
          done
          cp -L db4/lib/*.a "$STATICROOT/lib/"
          ln -s "$(brew --prefix boost@1.85)/include/boost" "$STATICROOT/include/boost"
          for lib in libboost_system libboost_filesystem libboost_program_options \
                     libboost_thread libboost_chrono libboost_unit_test_framework \
                     libdb_cxx libssl libcrypto libevent libevent_pthreads; do
            ls "$STATICROOT"/lib/${lib}*.a >/dev/null 2>&1 || { echo "MISSING static archive: $lib"; ls "$STATICROOT/lib"; exit 1; }
          done
          ls "$STATICROOT/lib" | head -50

      - name: Configure
        run: |
          ./autogen.sh
          STATICROOT="$PWD/.staticdeps"
          BREW_PREFIX="$(brew --prefix)"
          ./configure --without-gui --with-incompatible-bdb --disable-bench \
            --with-boost="$STATICROOT" \
            CPPFLAGS="-I$PWD/db4/include -I${BREW_PREFIX}/include" \
            LDFLAGS="-L${STATICROOT}/lib" ${{ matrix.net == 'easynet' && '--with-easynet' || '' }}
          if [ "${{ matrix.net }}" = easynet ]; then
            grep -q '^#define FREEBANK_EASYNET_BUILD 1' src/config/bitcoin-config.h || { echo "FREEBANK_EASYNET_BUILD not defined"; exit 1; }
          fi

      - name: Dump config.log on configure failure
        if: failure()
        run: tail -150 config.log

      - name: Build
        run: make -j3

      - name: Version smoke test
        run: |
          ./src/freebankd --version | head -3
          ./src/freebank-cli --version | head -1

      - name: Unit test suite
        # The beta job runs them; the easynet build is the same code with other chain parameters.
        if: matrix.net == 'beta'
        run: make check

      - name: Dump test log on failure
        if: failure()
        run: tail -200 src/test-suite.log 2>/dev/null || true

      - name: Package tarball
        run: |
          # BUILD_DESC is always four components (v0.2.7.0-<commit>), so a
          # three-component capture silently drops a patch release: v0.2.7.1
          # would package as freebank-0.2.7-*, colliding with the v0.2.7 asset.
          # Capture all four, then strip a trailing .0 so plain releases keep
          # their three-component name.
          VER=$(./src/freebank-cli --version | head -1 | sed -E 's/.*v([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+).*/\1/; s/\.0$//')
          mkdir -p "dist/$PKG/bin"
          cp src/freebankd src/freebank-cli src/freebank-tx "dist/$PKG/bin/"
          strip -S "dist/$PKG/bin/"*
          cp COPYING README.md "dist/$PKG/"
          [ "$PKG" = freebank ] || bash contrib/easynet-readme.sh "$VER" > "dist/$PKG/EASYNET.md"
          gtar -C dist --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime='2026-07-20 10:00' -cf "${PKG}-${VER}-${{ matrix.arch }}-apple-darwin.tar" "$PKG"
          gzip -n "${PKG}-${VER}-${{ matrix.arch }}-apple-darwin.tar"
          shasum -a 256 "${PKG}-${VER}-${{ matrix.arch }}-apple-darwin.tar.gz"

      - name: Portability gate (no external dylib references)
        # Runs against the PACKAGED tarball, not the build tree. Only
        # /usr/lib and /System/Library references are acceptable — anything
        # else (brew, /usr/local) means the artifact only runs on the builder.
        run: |
          mkdir -p /tmp/porttest
          tar -xzf "${PKG}"-*-${{ matrix.arch }}-apple-darwin.tar.gz -C /tmp/porttest
          FAIL=0
          for b in freebankd freebank-cli freebank-tx; do
            echo "== $b"
            otool -L "/tmp/porttest/$PKG/bin/$b"
            BAD=$(otool -L "/tmp/porttest/$PKG/bin/$b" | tail -n +2 | grep -vE '^\s+(/usr/lib/|/System/Library/)' || true)
            if [ -n "$BAD" ]; then echo "NON-PORTABLE references in $b:"; echo "$BAD"; FAIL=1; fi
          done
          exit $FAIL

      - name: Homebrew-free run test
        # The exact failure mode that shipped broken in v0.2.1's first mac
        # asset: binaries that only run where brew's kegs exist. Hide brew
        # entirely and run the extracted artifact.
        run: |
          # Homebrew lives in /opt/homebrew on Apple Silicon; on Intel its kegs are in /usr/local/Cellar
          # (with /usr/local/opt links into it), so hiding the Cellar breaks every brew library path.
          HB=$( [ -d /opt/homebrew ] && echo /opt/homebrew || echo /usr/local/Cellar )
          sudo mv "$HB" "$HB.hidden"
          trap 'sudo mv "$HB.hidden" "$HB"' EXIT
          B=/tmp/porttest/$PKG/bin
          "$B/freebankd" --version | head -2
          if [ "$PKG" = freebank-easynet ]; then
            "$B/freebankd" -help | grep -A1 '^  -port=' | grep -q 28455 || { echo "freebankd help does not show easynet's P2P 28455"; exit 1; }
            "$B/freebank-cli" -help | grep -A1 '^  -rpcport=' | grep -q 28454 || { echo "freebank-cli help does not show easynet's RPC 28454"; exit 1; }
            echo "easynet ports: P2P 28455, RPC 28454"
          fi
          "$B/freebank-cli" --version | head -1
          "$B/freebank-tx" --help | head -1
          mkdir -p /tmp/fbsmoke2
          "$B/freebankd" -regtest -daemon -datadir=/tmp/fbsmoke2 -rpcuser=s -rpcpassword=s
          for i in $(seq 1 30); do
            "$B/freebank-cli" -regtest -datadir=/tmp/fbsmoke2 -rpcuser=s -rpcpassword=s getblockchaininfo >/dev/null 2>&1 && break
            sleep 1
          done
          "$B/freebank-cli" -regtest -datadir=/tmp/fbsmoke2 -rpcuser=s -rpcpassword=s getblockchaininfo | head -3
          "$B/freebank-cli" -regtest -datadir=/tmp/fbsmoke2 -rpcuser=s -rpcpassword=s stop
          sleep 2

      - name: Attest build provenance (tagged releases)
        # Records, signed by GitHub (Sigstore), that this tarball was built by this workflow from this
        # commit. Anyone can check it: gh attestation verify <tarball> --repo mbdrivechains/freebank
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.PKG }}-*-${{ matrix.arch }}-apple-darwin.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}-${{ matrix.arch }}-apple-darwin
          path: ${{ env.PKG }}-*-${{ matrix.arch }}-apple-darwin.tar.gz
