name: guix-linux

# Reproducible Linux x86_64 build with Guix (contrib/guix), run in the same Docker image as on a developer box
# (contrib/guix/docker). Anyone can compare this run's SHA256SUMS with their own build of the same commit.
# The version (and so the asset name freebank-<version>-x86_64-linux-gnu.tar.gz) comes from configure.ac; on a tag
# push the tag must match it.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["guix"]

permissions:
  contents: read

jobs:
  guix:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Free disk space; docker data on /mnt
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo systemctl stop docker docker.socket
          cfg=/etc/docker/daemon.json; [ -s "$cfg" ] || echo '{}' | sudo tee "$cfg" >/dev/null
          sudo jq '. + {"data-root": "/mnt/docker"}' "$cfg" | sudo tee "$cfg.new" >/dev/null && sudo mv "$cfg.new" "$cfg"
          sudo systemctl start docker
          df -h / /mnt
      - name: Guix build (Docker)
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          VER="${TAG#v}"
          JOBS=$(nproc) FORCE_VERSION="$VER" contrib/guix/docker/run.sh
      - name: SHA256SUMS
        run: |
          cd guix-build-*/output && find . -name '*.tar.gz' -exec sha256sum {} + | sort -k2 | tee ../../SHA256SUMS.guix
      - uses: actions/upload-artifact@v4
        with:
          name: freebank-guix
          path: |
            guix-build-*/output/*/*.tar.gz
            SHA256SUMS.guix

  attest:
    needs: guix
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freebank-guix
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: guix-build-*/output/*/*.tar.gz
